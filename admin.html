<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>உண்மை முகம் - நிர்வாகப் பகுதி (Admin Dashboard)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #b30000;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #ffffff;
            --text-gray: #b0b0b0;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: #ff4d4d;
            font-size: 22px;
            margin: 0;
        }
        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 16px;
            color: #ff4d4d;
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-gray);
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background: #333;
            margin-top: 10px;
        }
        .news-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 13px;
        }
        .news-list-item button {
            width: auto;
            padding: 6px 12px;
            background: #b30000;
            font-size: 12px;
        }
        .preview-img {
            max-width: 100px;
            max-height: 100px;
            margin-top: 5px;
            display: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa-solid fa-user-gear"></i> உண்மை முகம் - அட்மின்</h1>
        <a href="index.html" style="color: #fff; text-decoration: none; background: #333; padding: 8px 12px; border-radius: 6px; font-size: 13px;"><i class="fa-solid fa-house"></i> தளம் செல்க</a>
    </div>

    <!-- Login Box -->
    <div id="login-box" class="card">
        <h2>அட்மின் உள்நுழைவு (Admin Login)</h2>
        <label>கடவுச்சொல் (PIN - Default: 1234)</label>
        <input type="password" id="pin-input" placeholder="Enter PIN">
        <button onclick="checkLogin()"><i class="fa-solid fa-lock-open"></i> உள்நுழை (Login)</button>
    </div>

    <!-- Admin Dashboard (Hidden until login) -->
    <div id="admin-dashboard" style="display: none;">
        
        <!-- Add News Card -->
        <div class="card">
            <h2><i class="fa-solid fa-newspaper"></i> புதிய செய்தி பதிவேற்றுக (Add News)</h2>
            <label>செய்தி தலைப்பு (Title)</label>
            <input type="text" id="news-title" placeholder="தலைப்பை இங்கே எழுதுங்கள்">
            
            <label>பிரிவு (Category)</label>
            <select id="news-category">
                <option value="கோவை">கோவை</option>
                <option value="தமிழ்நாடு">தமிழ்நாடு</option>
                <option value="தேசியச் செய்தி">தேசியச் செய்தி</option>
                <option value="சிறப்புச் செய்தி">சிறப்புச் செய்தி</option>
            </select>

            <label>செய்தி விவரம் (Description)</label>
            <textarea id="news-desc" rows="4" placeholder="செய்தி விவரங்களை விரிவாக எழுதவும்..."></textarea>

            <label>நிருபர் பெயர் (Reporter)</label>
            <input type="text" id="news-reporter" value="Sadiq">

            <label>படம் சேர்க்க (Upload Image)</label>
            <input type="file" id="news-img-file" accept="image/*" onchange="previewImage(event)">
            <img id="img-preview" class="preview-img">
            <input type="hidden" id="news-img-base64">

            <button onclick="addNewNews()"><i class="fa-solid fa-plus"></i> செய்தியை வெளியிடு (Publish News)</button>
        </div>

        <!-- Ticker Settings -->
        <div class="card">
            <h2><i class="fa-solid fa-bullhorn"></i> முக்கிய செய்தி ஓடும் பட்டி (Breaking Ticker)</h2>
            <label>முக்கிய செய்தி உரை (Ticker Text)</label>
            <input type="text" id="ticker-input" value="உண்மை முகம் செய்தி தளத்திற்கு உங்களை வரவேற்கிறோம்.">
            <button onclick="saveTicker()"><i class="fa-solid fa-floppy-disk"></i> பட்டியை மாற்று (Update Ticker)</button>
        </div>

        <!-- Published News Management -->
        <div class="card">
            <h2><i class="fa-solid fa-list"></i> வெளியிடப்பட்ட செய்திகள் (Manage News)</h2>
            <div id="manage-news-list">
                <!-- Dynamic list -->
            </div>
        </div>

        <!-- Export Data -->
        <div class="card">
            <h2><i class="fa-solid fa-download"></i> தரவுகளை சேமிக்கவும் (Export Data)</h2>
            <p style="font-size: 13px; color: var(--text-gray);">செய்திகள் மற்றும் அமைப்புகளை சேமிக்க கீழே உள்ள பட்டனை அழுத்தவும்:</p>
            <button onclick="exportData()"><i class="fa-solid fa-file-arrow-down"></i> news.json மற்றும் ticker.json பதிவிறக்கம்</button>
            <button class="btn-secondary" onclick="window.location.href='index.html'"><i class="fa-solid fa-eye"></i> தளத்தை பார்க்க (View Site)</button>
        </div>
    </div>

    <script>
        let newsData = [];
        let tickerData = { text: "உண்மை முகம் செய்தி தளத்திற்கு உங்களை வரவேற்கிறோம்." };
        let base64Image = "";

        // Load initial data from localStorage or json
        window.onload = function() {
            if(localStorage.getItem('um_news')) {
                newsData = JSON.parse(localStorage.getItem('um_news'));
            } else {
                newsData = [
                    { title: "டெமோ செய்தி", category: "கோவை", description: "உண்மை முகம் டெமோ செய்தி விபரம் இங்கே வரும்.", reporter: "Sadiq", time: "இப்போது", image: "" }
                ];
            }
            if(localStorage.getItem('um_ticker')) {
                tickerData = JSON.parse(localStorage.getItem('um_ticker'));
                document.getElementById('ticker-input').value = tickerData.text;
            }
            renderManageList();
        };

        function checkLogin() {
            const pin = document.getElementById('pin-input').value;
            if(pin === '1234') {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
            } else {
                alert('தவறான கடவுச்சொல்! (Incorrect PIN. Try 1234)');
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    // Compress image via canvas
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        base64Image = canvas.toDataURL('image/jpeg', 0.85);
                        
                        const preview = document.getElementById('img-preview');
                        preview.src = base64Image;
                        preview.style.display = 'block';
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function addNewNews() {
            const title = document.getElementById('news-title').value;
            const category = document.getElementById('news-category').value;
            const description = document.getElementById('news-desc').value;
            const reporter = document.getElementById('news-reporter').value;

            if(!title || !description) {
                alert('தயவுசெய்து தலைப்பு மற்றும் விவரத்தை நிரப்பவும்!');
                return;
            }

            const newPost = {
                title: title,
                category: category,
                description: description,
                reporter: reporter || 'Sadiq',
                time: 'இப்போது',
                image: base64Image || ''
            };

            newsData.unshift(newPost);
            localStorage.setItem('um_news', JSON.stringify(newsData));
            
            // Clear form
            document.getElementById('news-title').value = '';
            document.getElementById('news-desc').value = '';
            document.getElementById('news-img-file').value = '';
            document.getElementById('img-preview').style.display = 'none';
            base64Image = '';

            renderManageList();
            alert('செய்தி வெற்றிகரமாக வெளியிடப்பட்டது! (Published successfully)');
        }

        function saveTicker() {
            const text = document.getElementById('ticker-input').value;
            tickerData = { text: text };
            localStorage.setItem('um_ticker', JSON.stringify(tickerData));
            alert('முக்கிய செய்தி பட்டி புதுப்பிக்கப்பட்டது!');
        }

        function deleteNews(index) {
            if(confirm('இந்தச் செய்தியை நீக்க விரும்புகிறீர்களா?')) {
                newsData.splice(index, 1);
                localStorage.setItem('um_news', JSON.stringify(newsData));
                renderManageList();
            }
        }

        function renderManageList() {
            const container = document.getElementById('manage-news-list');
            if(newsData.length === 0) {
                container.innerHTML = '<p style="color:#888; font-size:13px;">செய்திகள் எதுவும் இல்லை.</p>';
                return;
            }
            container.innerHTML = '';
            newsData.forEach((item, idx) => {
                container.innerHTML += `
                    <div class="news-list-item">
                        <div>
                            <strong>[${item.category}]</strong> ${item.title.substring(0, 30)}...
                        </div>
                        <button onclick="deleteNews(${idx})"><i class="fa-solid fa-trash"></i> நீக்கு</button>
                    </div>
                `;
            });
        }

        function exportData() {
            // Download news.json
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(newsData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "news.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();

            // Download ticker.json
            setTimeout(() => {
                const tickerStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tickerData, null, 2));
                const tickerAnchor = document.createElement('a');
                tickerAnchor.setAttribute("href", tickerStr);
                tickerAnchor.setAttribute("download", "ticker.json");
                document.body.appendChild(tickerAnchor);
                tickerAnchor.click();
                tickerAnchor.remove();
                alert('news.json மற்றும் ticker.json கோப்புகள் வெற்றிகரமாக பதிவிறக்கம் செய்யப்பட்டன!');
            }, 500);
        }
    </script>
</body>
</html>
